unbind r
bind r source-file ~/.tmux.conf

set -g prefix C-s
set -g mouse on
set -g default-terminal "tmux-256color"
set -g renumber-windows on

# Keep view at current scroll position after a mouse selection.
# Default MouseDragEnd runs copy-pipe-AND-CANCEL, which exits copy-mode and
# snaps back to the live bottom. Use the -no-clear variant to copy WITHOUT
# leaving copy-mode, so the scroll position is preserved.
bind-key -T copy-mode    MouseDragEnd1Pane send-keys -X copy-pipe-no-clear
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-no-clear

# A plain left-click in copy-mode clears the selection but stays put
# (default is copy-selection-and-cancel, which would also jump to bottom).
bind-key -T copy-mode    MouseDown1Pane    select-pane \; send-keys -X clear-selection
bind-key -T copy-mode-vi MouseDown1Pane    select-pane \; send-keys -X clear-selection

# Snappier mouse/drag handling (helps the drag-to-edge auto-scroll feel smoother).
set -sg escape-time 0

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

bind-key % split-window -h -c '#{pane_current_path}'
bind-key '"' split-window -v -c '#{pane_current_path}'

# List of plugins
set -g @plugin 'tmux-plugins/tpm'

# Minimal monochrome theme.
set -g status-position top
set -g status 2
set -g status-format[1] '#[fill=default]'
set -g status-style 'fg=#888888,bg=default'
set -g status-left ''
set -g status-right '  #S   %H:%M '
set -g status-right-length 40
set -g status-left-style default
set -g status-right-style default
set -g window-status-separator ' '
set -g window-status-format "  #I:#{?#{m:[⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏]*,#{pane_title}},#{=1:pane_title} ,}#W "
set -g window-status-current-format "  #I:#{?#{m:[⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏]*,#{pane_title}},#{=1:pane_title} ,}#W "
set -g window-status-style 'fg=#888888,bg=default,none'
set -g window-status-current-style 'fg=#eeeeee,bg=default,bold'
set -g window-status-activity-style 'fg=#cccccc,bg=default,underscore'
set -g window-status-bell-style 'fg=#eeeeee,bg=default,bold,underscore'
set -g pane-border-style 'fg=#333333'
set -g pane-active-border-style 'fg=#888888'
set -g message-style 'fg=#eeeeee,bg=#303030'
set -g message-command-style 'fg=#eeeeee,bg=#303030'
set -g mode-style 'fg=#161616,bg=#cccccc'
set -g copy-mode-match-style 'fg=#eeeeee,bg=#444444'
set -g copy-mode-current-match-style 'fg=#161616,bg=#cccccc'
set -g copy-mode-mark-style 'fg=#161616,bg=#cccccc'
set -g menu-style 'fg=#cccccc,bg=#161616'
set -g menu-selected-style 'fg=#eeeeee,bg=#303030,bold'
set -g menu-border-style 'fg=#555555'
set -g popup-style 'fg=#cccccc,bg=#161616'
set -g popup-border-style 'fg=#555555'
set -g display-panes-colour '#888888'
set -g display-panes-active-colour '#eeeeee'
set -g clock-mode-colour '#cccccc'
set -g prompt-cursor-colour '#eeeeee'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# Wheel-up enters copy-mode WITHOUT -e, so scrolling back down to the live
# bottom does NOT auto-exit copy-mode (which would discard an active selection).
# Quit copy-mode explicitly with q / Escape instead.
bind-key -T root WheelUpPane if-shell -F "#{||:#{alternate_on},#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { copy-mode }

# ---- vi-style keyboard copy ----
set -g mode-keys vi
# v: start selection  |  V: line select  |  C-v: toggle rectangle (block) select
bind-key -T copy-mode-vi v     send-keys -X begin-selection
bind-key -T copy-mode-vi V     send-keys -X select-line
bind-key -T copy-mode-vi C-v   send-keys -X rectangle-toggle
# y: yank selection to the macOS system clipboard and leave copy-mode
bind-key -T copy-mode-vi y     send-keys -X copy-pipe-and-cancel "pbcopy"
# Y: yank but stay in copy-mode at the current scroll position
bind-key -T copy-mode-vi Y     send-keys -X copy-pipe-no-clear "pbcopy"
# Escape clears an in-progress selection (instead of exiting copy-mode)
bind-key -T copy-mode-vi Escape send-keys -X clear-selection

unbind r
bind r source-file ~/.tmux.conf

set -g prefix C-s
set -g mouse on
set -g default-terminal "tmux-256color"

# Keep view at current scroll position after a mouse selection.
# Default MouseDragEnd runs copy-pipe-AND-CANCEL, which exits copy-mode and
# snaps back to the live bottom. Use the -no-clear variant to copy WITHOUT
# leaving copy-mode, so the scroll position is preserved.
bind-key -T copy-mode    MouseDragEnd1Pane send-keys -X copy-pipe-no-clear
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-no-clear

# A plain left-click in copy-mode clears the selection but stays put
# (default is copy-selection-and-cancel, which would also jump to bottom).
bind-key -T copy-mode    MouseDown1Pane    select-pane \; send-keys -X clear-selection
bind-key -T copy-mode-vi MouseDown1Pane    select-pane \; send-keys -X clear-selection

# Snappier mouse/drag handling (helps the drag-to-edge auto-scroll feel smoother).
set -sg escape-time 0

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux#v2.1.3'

# Configure the catppuccin plugin
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"

# Load catppuccin
run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux
# For TPM, instead use `run ~/.tmux/plugins/tmux/catppuccin.tmux`

# Make the status line pretty and add some modules
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
# set -agF status-right "#{E:@catppuccin_status_cpu}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_uptime}"
set -agF status-right "#{E:@catppuccin_status_battery}"

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# Wheel-up enters copy-mode WITHOUT -e, so scrolling back down to the live
# bottom does NOT auto-exit copy-mode (which would discard an active selection).
# Quit copy-mode explicitly with q / Escape instead.
bind-key -T root WheelUpPane if-shell -F "#{||:#{alternate_on},#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { copy-mode }

# ---- vi-style keyboard copy ----
set -g mode-keys vi
# v: start selection  |  V: line select  |  C-v: toggle rectangle (block) select
bind-key -T copy-mode-vi v     send-keys -X begin-selection
bind-key -T copy-mode-vi V     send-keys -X select-line
bind-key -T copy-mode-vi C-v   send-keys -X rectangle-toggle
# y: yank selection to the macOS system clipboard and leave copy-mode
bind-key -T copy-mode-vi y     send-keys -X copy-pipe-and-cancel "pbcopy"
# Y: yank but stay in copy-mode at the current scroll position
bind-key -T copy-mode-vi Y     send-keys -X copy-pipe-no-clear "pbcopy"
# Escape clears an in-progress selection (instead of exiting copy-mode)
bind-key -T copy-mode-vi Escape send-keys -X clear-selection
